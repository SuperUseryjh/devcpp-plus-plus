[package]
name = "devcpp-plus-plus"
version = "0.2.0"
description = "A lightweight modern C++ IDE"
authors = ["devcpp-plus-plus contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devcpp_plus_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
which = "8"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
notify = "8"
trash = "5"
regex = "1"
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_System_Console"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
